<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Stéphane Donchery</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAFAF7'/%3E%3Ccircle cx='12' cy='16' r='9' fill='none' stroke='%2317171E' stroke-width='2'/%3E%3Cpath d='M18 6 L28 26 L8 26 Z' fill='none' stroke='%23FF5A3C' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts.css">
<style>
  :root{ --paper:#FAFAF7; --ink:#17171E; --muted:#6B6B75; --cobalt:#2A2AF0; --coral:#FF5A3C;
    --ff-display:'Unbounded',sans-serif; --ff-body:'Manrope',sans-serif; --ff-mono:'Space Mono',monospace; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:var(--ff-body); display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .code{ font-family:var(--ff-display); font-weight:900; font-size:clamp(5rem,22vw,12rem); line-height:.9; color:var(--cobalt); letter-spacing:-0.03em; }
  h1{ font-family:var(--ff-display); font-weight:700; font-size:clamp(1.4rem,4vw,2.2rem); margin:1rem 0 .6rem; }
  p{ color:var(--muted); max-width:36ch; margin:0 auto 2rem; }
  .tag{ font-family:var(--ff-mono); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); }
  a.home{ display:inline-flex; align-items:center; gap:.5rem; text-decoration:none; font-weight:600;
    background:var(--ink); color:var(--paper); padding:.75rem 1.4rem; border-radius:100px; transition:background .25s ease; }
  a.home:hover{ background:var(--cobalt); }
</style>
</head>
<body>
  <main>
    <p class="tag">Erreur 404</p>
    <div class="code">404</div>
    <h1>Cette page a disparu du radar.</h1>
    <p>Le lien est peut-être cassé, ou la page a été déplacée. Revenons en terrain connu.</p>
    <a class="home" href="/">← Retour à l'accueil</a>
  </main>
</body>
</html>
